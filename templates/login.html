<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Solvestreak</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        (function () {
            try {
                // Mirrors base.html's theme/palette logic so the sign-in
                // page matches whatever the person last picked (falling
                // back to the same app-wide Blue Moon dark default) instead
                // of always showing the original light Liquid Rosé theme.
                var saved = localStorage.getItem('solvestreak-theme');
                document.documentElement.setAttribute('data-theme', saved || 'dark');

                var savedPalette = localStorage.getItem('solvestreak-palette');
                var paletteToApply = savedPalette || 'blue-moon';
                if (paletteToApply !== 'classic') {
                    document.documentElement.setAttribute('data-palette', paletteToApply);
                }
            } catch (e) {}
        })();
    </script>
    <style>
        .login-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 15% 20%, var(--bg-mesh-1) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, var(--bg-mesh-2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, var(--bg-mesh-3) 0%, transparent 55%);
            padding: 1.5rem;
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        .login-ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(45px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
            animation: hero-shard-drift 24s ease-in-out infinite;
        }

        /* Blob colors are derived from each theme's own raw identity
           tokens (--candy-pink/--raspberry/--cherry-blossom/--berry) via
           relative color syntax, so they follow whichever palette is
           active instead of always showing Liquid Rosé's violet/cyan. */
        .login-blob-1 {
            top: 15%;
            left: 20%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgb(from var(--candy-pink) r g b / 0.35) 0%, rgb(from var(--raspberry) r g b / 0.2) 50%, transparent 70%);
        }

        .login-blob-2 {
            bottom: 15%;
            right: 20%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgb(from var(--cherry-blossom) r g b / 0.35) 0%, rgb(from var(--berry) r g b / 0.2) 50%, transparent 70%);
            animation-delay: -8s;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border-a);
            border-radius: 28px;
            box-shadow: var(--glass-shadow), var(--glass-inner-bevel);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            backdrop-filter: blur(24px) saturate(160%);
            padding: 2.75rem 2.25rem;
            text-align: center;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transform: perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
            transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 220ms ease;
        }

        .login-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            pointer-events: none;
            z-index: 2;
        }

        /* Uses --accent/--accent-hover (which every palette redefines per
           light/dark mode) instead of the old hardcoded violet/rose and
           dark-mode cyan/lavender/pink, so the brand text follows whichever
           theme is active in both modes without needing a separate
           dark-mode override here. */
        .login-brand {
            font-family: var(--font-heading);
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.035em;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .login-tagline {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0 0 2rem;
            line-height: 1.45;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.85rem 1.4rem;
            border-radius: 999px;
            border: 1px solid var(--glass-border-a);
            background: var(--glass-bg);
            color: var(--heading);
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            backdrop-filter: blur(14px) saturate(160%);
            box-shadow:
                0 8px 24px -4px rgba(16, 21, 39, 0.1),
                var(--glass-inner-bevel);
            transform: translate(var(--magnet-x, 0px), var(--magnet-y, 0px));
            transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 220ms ease, border-color 220ms ease;
        }

        .google-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle 70px at var(--mx, 50%) var(--my, 20%), rgba(255, 255, 255, 0.65), transparent 70%),
                linear-gradient(180deg, var(--glass-highlight) 0%, transparent 60%);
            opacity: 0.75;
            transition: opacity 240ms ease;
            pointer-events: none;
        }

        .google-btn:hover {
            transform: translate(var(--magnet-x, 0px), var(--magnet-y, 0px)) translateY(-2px) scale(1.02);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow:
                0 14px 30px -4px rgb(from var(--raspberry) r g b / 0.35),
                var(--glass-inner-bevel);
        }

        .google-btn:hover::after {
            opacity: 1;
        }

        .google-btn:active {
            transform: scale(0.96) translateY(1px);
        }

        .login-note {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .login-theme-corner {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-ambient-blob login-blob-1" aria-hidden="true"></div>
        <div class="login-ambient-blob login-blob-2" aria-hidden="true"></div>

        <div class="login-theme-corner">
            <button type="button" class="icon-btn" data-theme-toggle aria-pressed="true" aria-label="Toggle theme">
                <i data-lucide="moon" class="icon-moon"></i>
                <i data-lucide="sun" class="icon-sun"></i>
            </button>
        </div>

        <div class="login-card">
            <span class="login-brand">Solvestreak</span>
            <p class="login-tagline">Sign in to pick up right where you left off.</p>

            <a class="google-btn" href="{{ url_for('auth.google_login') }}">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.2-17 10.3z"/>
                    <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2 1.5-4.7 2.5-7.7 2.5-5.3 0-9.8-3.5-11.3-8.3l-6.6 5.1C9.8 39.5 16.3 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.2 5.6l6.6 5.6C40.9 36.6 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                </svg>
                Sign in with Google
            </a>

            <p class="login-note">Your session stays signed in on this device until you sign out — no need to log in again each time you open the app.</p>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
